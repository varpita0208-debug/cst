<!DOCTYPE html>
<html>
<head>
    <title>Class Time Table</title>
    <style>
        body {
            margin: 20px 40px;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h2 { color: #003366; }
        table {
            border-collapse: collapse;
            width: 95%;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 12px;
            text-align: center;
        }
        th {
            background-color: #003366;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Class Time Table – CSE 3rd Semester</h2>
    <table>
        <tr>
            <th>Day / Time</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
            <th>1:00 - 2:00</th>
            <th>2:00 - 3:00</th>
        </tr>
        <tr>
            <td><b>Monday</b></td>
            <td>Maths</td>
            <td>DSA</td>
            <td>DBMS</td>
            <td rowspan="5"><i>Lunch Break</i></td>
            <td>OS</td>
            <td>Lab</td>
        </tr>
        <tr>
            <td><b>Tuesday</b></td>
            <td>DBMS</td>
            <td>OS</td>
            <td>Maths</td>
            <td>DSA</td>
            <td>Lab</td>
        </tr>
        <tr>
            <td><b>Wednesday</b></td>
            <td>DSA</td>
            <td>Maths</td>
            <td>OS</td>
            <td>DBMS</td>
            <td>Tutorial</td>
        </tr>
        <tr>
            <td><b>Thursday</b></td>
            <td>OS</td>
            <td>DBMS</td>
            <td>DSA</td>
            <td>Maths</td>
            <td>Lab</td>
        </tr>
        <tr>
            <td><b>Friday</b></td>
            <td>Maths</td>
            <td>DSA</td>
            <td>DBMS</td>
            <td>OS</td>
            <td>Sports</td>
        </tr>
    </table>
</body>
</html>
