<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body {
            margin: 20px 40px;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h2 { color: #003366; }
        table {
            border-collapse: collapse;
        }
        td {
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <h2>Contact Us</h2>
    <p>Feel free to reach out to us for any queries or assistance.</p>
    <hr>
    <table>
        <tr>
            <td><b>Address:</b></td>
            <td>Chitkara University, Rajpura, Punjab - 140401</td>
        </tr>
        <tr>
            <td><b>Phone:</b></td>
            <td>+91-1800-XXX-XXXX</td>
        </tr>
        <tr>
            <td><b>Email:</b></td>
            <td><a href="mailto:info@chitkara.edu.in">info@chitkara.edu.in</a></td>
        </tr>
        <tr>
            <td><b>Website:</b></td>
            <td><a href="https://www.chitkara.edu.in" target="_blank">www.chitkara.edu.in</a></td>
        </tr>
    </table>
    <hr>
    <h3>Send us a Message</h3>
    <form action="#" method="post">
        <table>
            <tr>
                <td><b>Your Name:</b></td>
                <td><input type="text" name="name" placeholder="Enter your name" style="width:250px;padding:6px;"></td>
            </tr>
            <tr>
                <td><b>Your Email:</b></td>
                <td><input type="email" name="email" placeholder="Enter your email" style="width:250px;padding:6px;"></td>
            </tr>
            <tr>
                <td><b>Message:</b></td>
                <td><textarea name="message" rows="4" placeholder="Write your message..." style="width:250px;padding:6px;"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Send Message" style="padding:8px 20px;background-color:#003366;color:white;border:none;cursor:pointer;"></td>
            </tr>
        </table>
    </form>
</body>
</html>
