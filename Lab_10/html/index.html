<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
</head>
<body>
<h1>Restaurant Menu</h1>
<table border="1" cellpadding="8" cellspacing="0" style="text-align: center;">
<caption>Sample Restaurant Menu</caption>
<tr><th colspan="3">Food and Drinks</th></tr>
<tr><th>Category</th><th>Food Item</th><th>Price (₹)</th></tr>
<tr><th rowspan="3" scope="rowgroup">Starters</th><td>Soup</td><td>80</td></tr>
<tr><td>Paneer Tikka</td><td>180</td></tr>
<tr><td>French Fries</td><td>100</td></tr>
<tr><th rowspan="3" scope="rowgroup">Main Course</th><td>Dal Rice</td><td>160</td></tr>
<tr><td>Paneer Curry</td><td>220</td></tr>
<tr><td>Vegetable Biryani</td><td>180</td></tr>
<tr><th rowspan="3" scope="rowgroup">Desserts</th><td>Ice Cream</td><td>70</td></tr>
<tr><td>Gulab Jamun</td><td>60</td></tr>
<tr><td>Brownie</td><td>100</td></tr>
<tr><th rowspan="3" scope="rowgroup">Drinks</th><td>Lemonade</td><td>50</td></tr>
<tr><td>Mango Shake</td><td>100</td></tr>
<tr><td>Coffee</td><td>80</td></tr>
</table>
</body>
</html>
